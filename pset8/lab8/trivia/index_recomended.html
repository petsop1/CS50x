<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            // Run script only after the all DOM content were loaded
            document.addEventListener("DOMContentLoaded", function() {

                // When correct answer is clicked, change color to green
                let correct = document.querySelector(".correct");
                correct.addEventListener("click", function() {
                    correct.style.backgroundColor = "green";
                    document.querySelector("#response1").innerHTML = "Correct!"
                });

                // When any incorect answer is clicked, change color to red
                let incorrects = document.querySelectorAll(".incorect");
                for (let i = 0; i < incorrects.length; i++) {
                    incorrects[i].addEventListener("click", function() {
                        incorrects[i].style.backgroundColor = "red";
                        document.querySelector("#response1").innerHTML = "Incorrect!";
                    });
                }

                // Check free response submission
                document.querySelector("#check").addEventListener("click", function() {
                    let input = document.querySelector("input");
                    if (input.value.trim() === "Bratislava") {
                        input.style.backgroundColor = "green";
                        document.querySelector("#response2").innerHTML = "Correct!";
                    } else {
                        input.style.backgroundColor = "red";
                        document.querySelector("#response2").innerHTML = "Incorrect!";
                    }
                });

            });
        </script>
    </head>

    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <h3>Which country is known as the Land of the Rising Sun</h3>
                <h3 id="response1"></h3>
                <button class="incorect">Slovakia</button>
                <button class="incorect">France</button>
                <button class="incorect">India</button>
                <button class="correct">Japan</button>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <h3>What is capital city of Slovakia</h3>
                <h3 id="response2"></h3>
                <input placeholder="Enter your answer...">
                <button id="check">Check Answer</button>
            </div>
        </div>
    </body>
</html>
