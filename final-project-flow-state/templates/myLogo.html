<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <title>Interactive Histogram</title>
    <style>
        /* Root level CSS variables for column width and container padding */
        :root {
            --icon-size: 1.7rem;
            --column-width: calc(var(--icon-size) / 4); /* 26px / 11 ≈ 2.4px */;
            --column-max-height: calc(var(--icon-size) * 0.85); /* 26px * 0.85 ≈ 22px */
            --column-hover-increase: 20%; /* The percentage increase in column size on hover */
            --container-padding: 0rem;
            --column-border: .05rem;
        }

        /* Styles for the body to center its content  */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* Styles for the outer container */
        .outerContainer {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: absolute; 
            bottom: 50vh; 
            box-sizing: border-box; /* Include padding in width */
            padding: 0 calc(var(--column-width) / 2 - var(--container-padding)); /* Add padding to container */
        }

        /* Styles for each container */
        .container {
            flex: 1; /* Make each container take up equal space */
            margin: 0; /* Remove margin from the sides */
            padding: 0 var(--container-padding); /* Add padding to the sides */
            position: relative; /* Add this */
            display: flex; /* Add this */
            align-items: flex-end; /* Add this */
        }

        /* Styles for each column */
        .column {
            width: var(--column-width);
            border-top: var(--column-border) solid;
            border-right: var(--column-border) solid;
            border-left: var(--column-border) solid;
            background-color: transparent; /* Set initial background color to transparent */
            transition: background-color 0.3s; /* Add transition */
        }
        
        .height1 {
            height: var(--column-max-height);
        }

        .height2 {
            height: calc(var(--column-max-height) * 0.65); /* 65% of the maximum height */
        }

        .height3 {
            height: calc(var(--column-max-height) * 0.4); /* 40% of the maximum height */
        }

        .height4 {
            height: calc(var(--column-max-height) * 0.9); /* 90% of the maximum height */
        }

        .column.border-blue {
            border-color: blue;
        }
        
        .column.border-white {
            border-color: white;
        }

        .column.border-white:hover {
            background-color: white; /* Change background color on hover */
        }

        .column.border-blue:hover {
           background-color: blue; /* Change background color to blue on hover */
        }

        .border-bottom-white {
            border: none; /* Remove all borders */
            border-bottom: 0.01rem solid white; /* Add bottom border */
        }

    </style>
</head>
<body style="background-color: black;">
    <div id="outerContainer" class="outerContainer border-bottom-white">
        <div id="container1" class="container">
            <div class="column border-white height1"></div>
        </div>
        <div id="container2" class="container">
            <div class="column border-blue height2"></div>
        </div>
        <div id="container3" class="container">
            <div class="column border-white height3"></div>
        </div>
        <div id="container4" class="container">
            <div class="column border-white height4"></div>
        </div>
    </div>

    <script>
        // JavaScript to handle mouse movement and resizing of columns
        window.onload = function() {
            const columns = document.querySelectorAll('.column');
            const rootFontSize = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('font-size'));
            const originalHeights = Array.from(columns).map(column => column.offsetHeight / rootFontSize);
            const columnWidth = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--column-width')) * rootFontSize;
            const columnMaxHeight = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--column-max-height'))  * rootFontSize;
            const columnHoverIncrease = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--column-hover-increase'));


            outerContainer.onmousemove = function(event) {
                Array.from(columns).forEach((column, index) => {
                    const rect = column.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const distanceFromCenter = Math.abs(event.clientX - centerX);
                    const percentageFromCenter = Math.max(0, 1 - (distanceFromCenter / rect.width));
                    const newHeight = originalHeights[index] * (1 + columnHoverIncrease / 100 * percentageFromCenter);
                    column.style.height = newHeight + 'rem';
                });
            };

            outerContainer.onmouseleave = function() {
                Array.from(columns).forEach((column, index) => {
                    column.style.height = originalHeights[index] + 'rem';
                });
            };
        };

    </script>
    
</body>
</html>
